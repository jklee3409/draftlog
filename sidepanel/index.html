<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Draftlog</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="bar">
    <b class="brand">Draftlog</b>
    <input id="search" type="search" placeholder="모든 버전에서 검색" autocomplete="off" aria-label="모든 버전에서 검색">
    <button class="btn ghost" data-act="menu" aria-haspopup="true" id="menuBtn">백업</button>
  </header>
  <div class="menu" id="menu" hidden>
    <button class="btn" data-act="export">백업 파일 내보내기</button>
    <label class="btn" for="importFile">백업 파일 불러오기</label>
    <input id="importFile" type="file" accept="application/json,.json" hidden>
    <p class="hint">데이터는 이 브라우저에만 저장돼요. 컴퓨터를 바꾸거나 확장을 지우기 전에 백업해 두세요.</p>
    <div id="importConfirm"></div>
  </div>
  <main id="main"></main>

  <div class="overlay" id="overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
      <div class="dlg-head"><h2 id="dlgTitle">비교</h2><span class="dstat" id="dstat"></span><button class="btn" data-act="closeDiff">닫기</button></div>
      <div class="diff" id="diffBody"></div>
      <div class="legend"><span><del>삭제</del> 이전에만 있음</span><span><ins>추가</ins> 이후에만 있음</span></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>

  <script src="../lib/text.js"></script>
  <script src="panel.js"></script>
</body>
</html>
